# ==============================================================================
# I-CAN PLATFORM — NETLIFY CONFIGURATION (netlify.toml)
# Optimized for React 18 + Vite + PWA + SPA Routing & Security Headers
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) routing: redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"

# Cache-Control for Service Worker and PWA Manifest (Must not be aggressively cached)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Cache-Control for Immutable Static Assets (Vite hashed bundles)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
